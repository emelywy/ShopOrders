name: ci

on:
  push:
    branches: [ main, ci-demo ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Отримати код
        uses: actions/checkout@v4

      - name: 1. Установити .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 2. Відновити залежності
        run: dotnet restore ShopOrders.sln

      - name: 3. Перевірити форматування за .editorconfig
        run: dotnet format ShopOrders.sln --verify-no-changes --no-restore

      - name: 4. Скласти Release без жодного попередження
        run: dotnet build ShopOrders.sln -c Release --no-restore -warnaserror

      - name: 5-6. Запустити тести з покриттям і порогом 70 %
        run: >-
          dotnet test ShopOrders.sln -c Release --no-build
          /p:CollectCoverage=true
          /p:Threshold=70
          /p:ThresholdType=line
          /p:ThresholdStat=total
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage/
          | tee test-output.txt

      - name: 6. Показати покриття в анотаціях прогону
        if: always()
        run: |
          table=$(grep -E '^\|' test-output.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Покриття (coverlet)::${table}"

      - name: 6. Показати тести, що впали
        if: failure()
        run: grep -E '^\s+Failed |Failed!|Passed!' test-output.txt | sed 's/^ *//' | while read -r line; do echo "::error title=Тест::${line}"; done

      - name: 7. Побудувати HTML-звіт про покриття
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5f3701a41d14548c9b8e575a5c235230e515cbc0 # v5
        with:
          reports: coverage/coverage.cobertura.xml
          targetdir: coveragereport
          reporttypes: Html;TextSummary;MarkdownSummaryGithub

      - name: 7. Показати підсумок покриття на сторінці прогону
        if: always()
        run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: 7. Опублікувати звіт про покриття як артефакт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coveragereport/

      - name: 8. Димовий прогін застосунку на демонстраційному вводі
        run: |
          dotnet run --project src/ShopOrders.App -c Release --no-build < docs/demo-input.txt | tee smoke-output.txt
          cp logs/shoporders.log smoke-log.txt
          cat smoke-log.txt

      - name: 9. Опублікувати реліз зі звітом покриття (лише для тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd coveragereport && zip -qr ../coverage-report.zip .)
          gh release create "$GITHUB_REF_NAME" coverage-report.zip test-output.txt smoke-output.txt smoke-log.txt \
            --title "ShopOrders $GITHUB_REF_NAME" \
            --notes "Самостійна робота № 3: HTML-звіт покриття, вивід тестів і димового прогону."

name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
    - name: Отримати код
      uses: actions/checkout@v4

    - name: Установити .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Відновити залежності
      run: dotnet restore ShopOrders.sln

    - name: Перевірка форматування
      continue-on-error: true
      run: dotnet format ShopOrders.sln --verify-no-changes --no-restore

    - name: Складання Release з аналізаторами
      run: dotnet build ShopOrders.sln -c Release --no-restore

    - name: Зберегти звіт про покриття
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: '**/coverage.cobertura.xml'
